<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tamu - Menjadi Petani Sukses</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10B981; /* Hijau Emerald */
            --primary-hover: #059669;
            --danger: #EF4444; /* Merah untuk tombol hapus */
            --danger-hover: #DC2626;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        button {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-tambah {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            margin-bottom: 24px;
        }

        .btn-tambah:hover {
            background-color: var(--primary-hover);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
        }

        ul {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        li {
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        /* Custom Scrollbar untuk list */
        ul::-webkit-scrollbar {
            width: 6px;
        }
        ul::-webkit-scrollbar-track {
            background: transparent;
        }
        ul::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 10px;
        }

        .btn-hapus-semua {
            width: 100%;
            background-color: var(--danger);
            color: white;
            padding: 12px;
        }

        .btn-hapus-semua:hover {
            background-color: var(--danger-hover);
        }

        /* Menyembunyikan daftar jika kosong */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-style: italic;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Daftar Tamu Seminar</h2>
            <p class="subtitle">"Menjadi Petani Sukses"</p>
        </div>
        
        <div class="input-group">
            <label for="Nama">Nama Tamu</label>
            <input type="text" id="Nama" placeholder="Ketik nama di sini..." autocomplete="off">
        </div>
        
        <button class="btn-tambah" onclick="tambahTamu()">+ Tambah Tamu</button>
        
        <hr>
        
        <h3>Daftar Hadir</h3>
        <ul id="daftarTamu">
            <div class="empty-state" id="emptyState">Belum ada tamu yang terdaftar.</div>
        </ul>

        <button class="btn-hapus-semua" onclick="hapusSemua()">Hapus Semua Data</button>
    </div>

    <script>
        const inputNama = document.getElementById('Nama');
        const daftarTamu = document.getElementById('daftarTamu');
        const emptyState = document.getElementById('emptyState');

        // Fungsi untuk menangani Enter di input
        inputNama.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                tambahTamu();
            }
        });

        function tambahTamu() {
            const nama = inputNama.value.trim();
            
            if (nama === "") {
                alert("Silakan masukkan nama tamu terlebih dahulu!");
                inputNama.focus();
                return;
            }

            // Hapus pesan "Belum ada tamu" jika ada
            if (emptyState && emptyState.parentNode === daftarTamu) {
                daftarTamu.removeChild(emptyState);
            }

            // Buat elemen list baru
            const li = document.createElement('li');
            li.textContent = nama;
            
            // Tambahkan ke daftar
            daftarTamu.appendChild(li);
            
            // Kosongkan input dan kembalikan fokus
            inputNama.value = "";
            inputNama.focus();
        }

        function hapusSemua() {
            if(daftarTamu.children.length === 0 || (daftarTamu.children.length === 1 && daftarTamu.children[0].id === 'emptyState')) {
                return; // Tidak ada yang perlu dihapus
            }

            const konfirmasi = confirm("Apakah Anda yakin ingin menghapus semua daftar tamu?");
            if (konfirmasi) {
                daftarTamu.innerHTML = '<div class="empty-state" id="emptyState">Belum ada tamu yang terdaftar.</div>';
            }
        }
    </script>
</body>
</html>
